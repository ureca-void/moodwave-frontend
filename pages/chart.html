<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/assets/css/pages/chart.css" />
    <title>내 음악 취향 통계</title>
  </head>
  <body>
    <div class="container">
      <h2>내 음악 취향 통계</h2>
      <div class="dashboard">
        <div class="chart-box">
          <h3>장르별 재생 비율</h3>
          <div class="chart-container"><canvas id="genreChart"></canvas></div>
        </div>

        <div class="chart-box">
          <h3>가장 많이 감상한 날씨 🎧</h3>
          <div class="chart-container"><canvas id="weatherChart"></canvas></div>
        </div>
      </div>

      <table class="song-table">
        <thead>
          <tr>
            <th>#</th>
            <th>제목</th>
            <th>앨범</th>
            <th>재생시간</th>
          </tr>
        </thead>
        <tbody>
          <tr class="song-row">
            <td>1</td>
            <td>밤편지</td>
            <td>Palette</td>
            <td>04:13</td>
          </tr>
          <tr class="song-row">
            <td>2</td>
            <td>Dynamite</td>
            <td>Dynamite</td>
            <td>03:19</td>
          </tr>
          <tr class="song-row">
            <td>3</td>
            <td>Hype Boy</td>
            <td>NewJeans 1st EP</td>
            <td>02:59</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/assets/js/pages/chart.js"></script>
  </body>
</html>
